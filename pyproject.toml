[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tq-json"
version = "0.1.0"
description = "Query JSON records with expressive filters"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["query", "json", "arrays"]
dependencies = []

[project.optional-dependencies]
cli = ["rich>=13.7,<15"]

[project.scripts]
tq = "tq.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tq"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
